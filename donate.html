<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>donation - form </title>
    <link rel="stylesheet" href="donate.css">
</head>

<body>
    <div class="donationform">
        <div class="donationcontainer2">

            <div class="donationimage">
            </div>

            <div class="formsection">
                <div class="formheading">Donate here </div>

                <div class="form">
                    <div class="form1">

                        <form action="">


                            <div class="namesection">
                                <div class="name">
                                    <label for="Fullname">Fullname:</label>
                                </div>

                                <input type="text" name="fullname" id="fullname" class="namein"
                                    placeholder="Enter your name">
                            </div>

                            <!-- phonesection -->

                            <div class="phonesection">
                                <div class="phone">
                                    <label for="phone">phone no : </label>
                                </div>
                                <input type="tel" name="phone" id="phone" class="phinput" pattern="[6-9]{1}[0-9]{9}"
                                    placeholder="phone no ">
                            </div>

                            <div class="emailsection">
                                <div class="email">
                                    <label for="email">E-mail: </label>
                                </div>
                                <input type="email" name="email" id="email" class="emailinput"
                                    placeholder="ex - tej123@gmail.com">
                            </div>

                            <!-- donate amount section -->

                            <div class="donateamountsection">
                                <div class="amount">
                                    <label for="donateamount">Donate amount : </label>
                                </div>

                                <div class="donateamounts">
                                    <button class="donationamount" type="button">₹10</button>
                                    <button class="donationamount" type="button">₹100</button>
                                    <button class="donationamount" type="button">₹500</button>
                                    <input type="number" name="donateamount" id="donateamount"
                                        placeholder="enter coustum amount">
                                </div>
                            </div>

                            <!-- payment method section        -->
                            <div class="paymentmethods">
                                <div class="phonepay">
                                    <input type="radio" name="methods" id="phonepay">
                                    <label for="phonepay">
                                        <img src="phonepay.png" alt="phone" height="50em">
                                    </label>
                                </div>

                                <div class="gpay">
                                    <input type="radio" name="methods" id="googlepay">
                                    <label for="googlepay">
                                        <img src="gpay.png" alt="gpay" height="19em">
                                    </label>
                                </div>

                                <div class="paypal">


                                    <input type="radio" name="methods" id="paypal">
                                    <label for="paypal">
                                        <img src="paypal.png" alt="paypal" height="70em">
                                    </label>
                                </div>
                            </div>

                            <!-- payment details -->

                            <div class="paymentdetails">

                                <label for="paymentnumber" class="details"> payment contact no :</label>
                                <input type="tel" name="paymentdetails" id="paymentdetails">

                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
</body>

</html>
